name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run check
      - name: Demo-mode smoke test (no Minecraft, no agents)
        run: npm run smoke
      # Java and Minecraft are not set up on CI, so exit code 2 (office ready, Minecraft not ready) is expected.
      # Exit code 1 (office not ready) or a crash fails the job.
      - name: Doctor (Minecraft not set up is allowed)
        shell: bash
        run: |
          set +e
          npm run doctor
          code=$?
          echo "doctor exit code: $code"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
